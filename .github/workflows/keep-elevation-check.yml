name: Backfill Keep Elevation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill elevation while preserving other activity data
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'run_page')
          from config import JSON_FILE, SQL_FILE
          from generator import Generator
          from generator.db import Activity
          from keep_sync import get_all_keep_tracks

          original = json.loads(Path(JSON_FILE).read_text())
          generator = Generator(SQL_FILE)
          rows = generator.session.query(Activity).all()
          existing_ids = {row.run_id for row in rows}
          with contextlib.redirect_stdout(io.StringIO()):
              tracks = get_all_keep_tracks(os.environ['KEEP_MOBILE'], os.environ['KEEP_PASSWORD'], [], ['running'])
          elevations = {track.id: track.elevation_gain for track in tracks if track is not None}
          if not existing_ids.issubset(elevations):
              raise RuntimeError('未取得全部历史活动，停止回填。')
          updated = []
          for activity in original:
              copy = dict(activity)
              elevation = elevations[activity['run_id']]
              copy['elevation_gain'] = float(elevation) if elevation is not None else 0.0
              updated.append(copy)
          for before, after in zip(original, updated, strict=True):
              assert {key: value for key, value in before.items() if key != 'elevation_gain'} == {key: value for key, value in after.items() if key != 'elevation_gain'}
          for row in rows:
              elevation = elevations[row.run_id]
              row.elevation_gain = float(elevation) if elevation is not None else 0.0
          generator.session.commit()
          Path(JSON_FILE).write_text(json.dumps(updated))
          assert generator.session.query(Activity).count() == len(existing_ids)
          generator.session.close()
          print('累计爬升回填完成，活动数量和其他字段均已校验。')
          PY
      - name: Commit corrected activity elevation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run_page/data.db src/static/activities.json
          if ! git diff --cached --quiet; then
            git commit -m '补齐 Keep 历史跑步累计爬升'
            git push
          fi
