name: Check Keep Elevation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check elevation fields without exposing credentials or raw records
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import requests
          sys.path.insert(0, 'run_page')
          from keep_sync import login, get_to_download_runs_ids, get_single_run_data, decode_runmap_data, parse_raw_data_to_nametuple

          session, headers = login(requests.Session(), os.environ['KEEP_MOBILE'], os.environ['KEEP_PASSWORD'])
          run_ids = get_to_download_runs_ids(session, headers, 'running')
          matches = re.compile(r'elev|altitude|ascent|climb|uphill|height|rise', re.I)

          def elevation_fields(value, path='data'):
              found = {}
              if isinstance(value, dict):
                  for key, child in value.items():
                      current = f'{path}.{key}'
                      if matches.search(key):
                          found[current] = child if isinstance(child, (int, float, bool, type(None))) else type(child).__name__
                      if isinstance(child, (dict, list)):
                          found.update(elevation_fields(child, current))
              elif isinstance(value, list):
                  for index, child in enumerate(value[:1]):
                      found.update(elevation_fields(child, f'{path}[{index}]'))
              return found

          for index, run_id in enumerate(run_ids[:8], 1):
              raw = get_single_run_data(session, headers, run_id, 'running')
              data = raw['data']
              points = decode_runmap_data(data['geoPoints'], True) if data.get('geoPoints') else []
              altitudes = [point['altitude'] for point in points if isinstance(point.get('altitude'), (int, float))]
              parsed = parse_raw_data_to_nametuple(raw, [], [])
              print(json.dumps({'sample': index, 'elevation_fields': elevation_fields(data), 'gps_points': len(points), 'altitude_points': len(altitudes), 'altitude_min': min(altitudes) if altitudes else None, 'altitude_max': max(altitudes) if altitudes else None, 'parsed_elevation_without_export': parsed.elevation_gain}, ensure_ascii=False))
          PY
