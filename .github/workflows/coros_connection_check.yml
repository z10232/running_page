name: Check COROS Connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 核验授权样例的导入错误类别
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys, json, zipfile, io
          import httpx, requests
          sys.path.insert(0, 'run_page')
          from coros_client import CorosClient, API_URL
          from keep_sync import login, get_to_download_runs_ids, get_single_run_data
          from keep_fit import build_keep_fit
          try:
              with requests.Session() as keep, httpx.Client(timeout=60) as session:
                  keep, headers = login(keep, os.environ['KEEP_MOBILE'], os.environ['KEEP_PASSWORD'])
                  ids = get_to_download_runs_ids(keep, headers, 'running')
                  run_id = next(value for value in ids if value.split('_')[1] == '9223370243835228807')
                  activity = get_single_run_data(keep, headers, run_id, 'running')['data']
                  content = build_keep_fit(activity)
                  print('授权样例 FIT 字节数:', len(content))
                  print('授权样例包含GPS:', bool(activity.get('geoPoints')))
                  print('授权样例包含心率序列:', bool((activity.get('heartRate') or {}).get('heartRates')))
                  client = CorosClient(session)
                  client.login(os.environ['COROS_ACCOUNT'], os.environ['COROS_PASSWORD'])
                  task = next(value for value in client.import_tasks() if value.get('originalFilename') == 'keep-9223370243835228807.fit')
                  print('样例任务状态与失败文件数:', task.get('status'), task.get('errorSize'))
                  response = session.get(API_URL+'/activity/fit/exportSportImportTaskErrorList', params={'accessToken':session.headers['accessToken'],'importId':task['id']})
                  response.raise_for_status()
                  raw = response.content
                  if zipfile.is_zipfile(io.BytesIO(raw)):
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          report = '\n'.join(archive.read(name).decode('utf-8', errors='ignore') for name in archive.namelist() if name.endswith('.xml'))
                  else:
                      report = raw.decode('utf-8', errors='ignore')
                  categories = {
                      '文件过小': ['too small', '20kb', '20KB', '文件太小', '文件过小'],
                      '缺少轨迹或记录': ['no track', 'no record', 'GPS', '轨迹', '记录为空', '没有运动数据'],
                      '文件或格式解析失败': ['parse', 'format', '解析', '格式', '文件异常', '文件损坏'],
                      '活动重复': ['duplicate', 'already exist', '重复'],
                      '运动类型不支持': ['unsupported', 'not support', '不支持'],
                      '压缩文件问题': ['zip', 'unzip', '解压'],
                      '活动时间问题': ['start time', 'duration', '时间异常', '时长'],
                  }
                  for label, words in categories.items():
                      if any(word in report for word in words):
                          print('错误报告包含类别:',label)
                  print('错误报告读取完成；未输出原始报告。')
          except Exception:
              print('样例诊断尚未完成；未输出原始响应或异常。')
              raise SystemExit(1)
          PY
