name: Check COROS Connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 核验授权样例在高驰的实际活动
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys, json, zipfile, io
          import httpx, requests
          sys.path.insert(0, 'run_page')
          from coros_client import CorosClient, API_URL
          from keep_sync import login, get_to_download_runs_ids, get_single_run_data
          from keep_fit import build_keep_fit
          try:
              with requests.Session() as keep, httpx.Client(timeout=60) as session:
                  keep, headers = login(keep, os.environ['KEEP_MOBILE'], os.environ['KEEP_PASSWORD'])
                  ids = get_to_download_runs_ids(keep, headers, 'running')
                  run_id = next(value for value in ids if value.split('_')[1] == '9223370243835228807')
                  activity = get_single_run_data(keep, headers, run_id, 'running')['data']
                  content = build_keep_fit(activity)
                  print('授权样例 FIT 字节数:', len(content))
                  print('授权样例包含GPS:', bool(activity.get('geoPoints')))
                  print('授权样例包含心率序列:', bool((activity.get('heartRate') or {}).get('heartRates')))
                  client = CorosClient(session)
                  client.login(os.environ['COROS_ACCOUNT'], os.environ['COROS_PASSWORD'])
                  task = next(value for value in client.import_tasks() if value.get('originalFilename') == 'keep-9223370243835228807.fit')
                  assert task['status'] == 2 and not task.get('errorSize')
                  print('授权样例导入任务已完成且没有失败文件。')
                  existing = client.find_activity(activity)
                  print('高驰活动列表中找到相同开始时间和用时的跑步:', bool(existing))
                  assert existing
                  from datetime import datetime
                  from zoneinfo import ZoneInfo
                  day = datetime.fromtimestamp(activity['startTime']//1000, ZoneInfo('Asia/Shanghai')).strftime('%Y%m%d')
                  data = client._request('GET','/activity/query', params={'startDay':day,'endDay':day,'modeList':'100,101,102,103','pageNumber':1,'size':100})
                  row = next(value for value in data['dataList'] if str(value['labelId']) == existing)
                  distance_matches = abs(float(row.get('distance',-100)) - activity['distance']) <= 1
                  ascent_matches = abs(float(row.get('ascent',-100)) - activity['accumulativeUpliftedHeight']) <= 1
                  print('高驰距离与 Keep 一致（误差不超过1米）:', distance_matches)
                  print('高驰累计爬升与 Keep 一致（误差不超过1米）:', ascent_matches)
                  assert distance_matches and ascent_matches
          except Exception:
              print('样例诊断尚未完成；未输出原始响应或异常。')
              raise SystemExit(1)
          PY
