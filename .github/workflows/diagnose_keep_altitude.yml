name: Repair Keep Altitude
on:
  workflow_dispatch:
concurrency:
  group: keep-running-data-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 补充11月8日原活动的独立海拔曲线
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
          RUNALYZE_API_TOKEN: ${{ secrets.RUNALYZE_API_TOKEN }}
        run: |
          python -u - <<'PY'
          """只补一条已存在活动的海拔；保留原活动编号，保存待确认回执。"""
          import hashlib
          import os
          import sys
          import time
          from pathlib import Path
          
          import httpx
          import requests
          from garmin_fit_sdk import Decoder, Stream
          
          sys.path.insert(0, 'run_page')
          from keep_sync import get_to_download_runs_ids, login
          from keep_to_runalyze_sync import _load_manifest, _prepare_fit, _save_manifest
          from runalyze_client import RunalyzeClient, RunalyzeError
          
          KEEP_ID = '9223370242749072807'
          MANIFEST = Path('activities/keep2runalyze.json')
          
          
          def main():
              manifest = _load_manifest(MANIFEST)
              original = manifest['accepted'][KEEP_ID]
              expected_id = original['activity_id']
              assert expected_id == 222476581
              with requests.Session() as keep, httpx.Client(timeout=60) as api:
                  result = login(keep, os.environ['KEEP_MOBILE'], os.environ['KEEP_PASSWORD'])
                  if not result:
                      raise ValueError('Keep login failed')
                  keep, headers = result
                  run_id = next(run for run in get_to_download_runs_ids(keep, headers, 'running') if run.split('_')[1] == KEEP_ID)
                  content = _prepare_fit(keep, headers, run_id)
                  decoded, errors = Decoder(Stream.from_byte_array(bytearray(content))).read()
                  assert not errors
                  records = decoded['record_mesgs']
                  heights = [r.get('enhanced_altitude', r.get('altitude')) for r in records if r.get('enhanced_altitude', r.get('altitude')) is not None]
                  print('修正版文件海拔点数量:', len(heights))
                  print('修正版文件包含下降变化:', any(b<a for a,b in zip(heights, heights[1:])))
                  print('修正版文件包含GPS坐标:', any('position_lat' in r or 'position_long' in r for r in records))
                  assert len(heights) > 1 and any(b<a for a,b in zip(heights, heights[1:]))
                  assert not any('position_lat' in r or 'position_long' in r for r in records)
                  digest = hashlib.sha256(content).hexdigest()
                  if original.get('sha256') == digest and not original.get('pending_altitude_repair'):
                      print('修正版文件已确认过，本轮不再上传。')
                      return 0
                  runalyze = RunalyzeClient(api, os.environ['RUNALYZE_API_TOKEN'])
                  runalyze.ping()
                  pending = original.get('pending_altitude_repair')
                  if not pending:
                      pending = runalyze.upload_fit(f'keep-{KEEP_ID}.fit', content)
                      original['pending_altitude_repair'] = pending
                      _save_manifest(MANIFEST, manifest)
                      print('单条修正版文件已接收，队列编号已保存。')
                  else:
                      print('恢复已保存的单条修复队列，不重复上传。')
                  for _ in range(30):
                      status = runalyze.get_import_status(pending['queue_id'])
                      if status.get('activity_id'):
                          if status['activity_id'] != expected_id:
                              print('返回活动编号与原活动不同，未认定原记录已补齐。')
                              return 1
                          manifest['accepted'][KEEP_ID] = {**pending, 'activity_id': expected_id}
                          _save_manifest(MANIFEST, manifest)
                          print('修正版文件已处理，活动编号与原记录一致。')
                          print('下降显示值仍需在RUNALYZE活动页面核对。')
                          return 0
                      time.sleep(5)
                  print('单条修复尚未确认，队列回执保留，后续先查询原队列。')
                  return 1
          
          
          if __name__ == '__main__':
              try:
                  result = main()
              except RunalyzeError as error:
                  print(str(error))
                  result = 1
              except Exception as error:
                  print('单条修复未完成，异常类型:', type(error).__name__)
                  result = 1
              raise SystemExit(result)
          PY
      - name: 保存单条海拔修复回执
        if: always()
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add activities/keep2runalyze.json
          if ! git diff --cached --quiet; then
            git commit -m '保存11月8日海拔补充处理回执'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
