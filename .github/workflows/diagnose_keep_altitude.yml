name: Diagnose Keep Altitude
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 读取11月8日独立海拔数据结构
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: |
          python -u - <<'PY'
          """单条 Keep 记录的结构诊断，只输出字段类型及数量。"""
          
          import gzip
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit
          from pathlib import Path
          
          import requests
          
          sys.path.insert(0, str(Path.cwd() / 'run_page'))
          from keep_sync import decode_runmap_data, get_single_run_data, get_to_download_runs_ids, login
          
          KEEP_ID = '9223370242749072807'
          GRAPH_API = 'https://api.gotokeep.com/minnow-webapp/v1/sportlog/sportData/chart/{log_id}'
          ALTITUDE_KEY = re.compile('altitude|elevation|height|uphill|downhill|climb', re.I)
          
          
          def shape(value, depth=0):
              result = {'type': type(value).__name__}
              if isinstance(value, (str, list, dict)):
                  result['length'] = len(value)
              if isinstance(value, dict):
                  result['keys'] = sorted(value)
                  if depth < 5:
                      result['fields'] = {key: shape(child, depth + 1) for key, child in value.items()}
              elif isinstance(value, list) and value and depth < 5:
                  result['first_item'] = shape(value[0], depth + 1)
              return result
          
          
          def altitude_fields(value, path='data'):
              result = {}
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = path + '.' + key
                      if ALTITUDE_KEY.search(key):
                          result[child_path] = shape(child)
                      if isinstance(child, dict):
                          result.update(altitude_fields(child, child_path))
              return result
          
          
          def main():
              with requests.Session() as session:
                  logged_in = login(session, os.environ['KEEP_MOBILE'], os.environ['KEEP_PASSWORD'])
                  if not logged_in:
                      print('Keep 登录未成功。')
                      return 1
                  session, headers = logged_in
                  runs = get_to_download_runs_ids(session, headers, 'running')
                  run_id = next(run for run in runs if run.split('_')[1] == KEEP_ID)
                  response = get_single_run_data(session, headers, run_id, 'running')
                  if not response or not isinstance(response.get('data'), dict):
                      print('未取得活动详情。')
                      return 1
                  detail = response['data']
                  print('详情字段结构:', json.dumps(shape(detail), ensure_ascii=False))
                  print('海拔相关字段结构:', json.dumps(altitude_fields(detail), ensure_ascii=False))
                  response = session.get(GRAPH_API.format(log_id=run_id), headers=headers,
                                         params={'itemCount': 1000}, timeout=45)
                  print('独立图表接口 HTTP:', response.status_code)
                  response.raise_for_status()
                  charts = response.json()['data']['charts']
                  chart = next(c for c in charts if c.get('chartMetaType')=='upliftedHeight')
                  points = decode_runmap_data(chart['chartData'])
                  xs = [point['x'] for point in points]
                  ys = [point['y'] for point in points]
                  baseline = detail.get('baselineAltitude')
                  elapsed = (detail['endTime']-detail['startTime'])/1000
                  checks = {
                      'x_starts_at_zero':xs[0]==0,
                      'x_sorted':xs==sorted(xs),
                      'x_within_elapsed_seconds':all(0<=x<=elapsed for x in xs),
                      'last_x_within_15_seconds_of_end':abs(elapsed-xs[-1])<=15,
                      'height_has_rise':any(b>a for a,b in zip(ys,ys[1:])),
                      'height_has_fall':any(b<a for a,b in zip(ys,ys[1:])),
                      'first_y_near_zero':abs(ys[0])<1,
                      'first_y_near_baseline':baseline is not None and abs(ys[0]-baseline)<1,
                      'baseline_near_zero':baseline is not None and abs(baseline)<1,
                      'fit_altitude_range_valid':all(-500<=y<=10000 for y in ys),
                      'min_max_all_zero':all(p['min']==p['max']==0 for p in points),
                  }
                  print('海拔时间与高度语义:',json.dumps(checks,ensure_ascii=False))
                  print('海拔统计标签:',json.dumps([item.get('label') for key in ('briefLeftNums','briefRightNums','briefNums','flowerBriefNums') for item in (chart.get(key) or []) if isinstance(item,dict)],ensure_ascii=False))
              return 0
          
          
          if __name__ == '__main__':
              try:
                  result = main()
              except Exception as error:
                  # 不记录异常文本、HTTP响应或认证信息。
                  print('诊断未完成，异常类型:', type(error).__name__)
                  result = 1
              raise SystemExit(result)
          PY
